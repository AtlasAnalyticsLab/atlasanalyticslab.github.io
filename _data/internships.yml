# Master's Research Interns (_data/internships.yml)
#
# Purpose:
#   Stores master's research interns, grouped with master's students on /team.
#   Displayed on /team page using _includes/team-grid.html
#
# Required Fields:
#   - name: Full name (required)
#
# Optional Fields:
#   - photo: Filename in /images/teampic/ (default: bio-photo.jpg)
#   - info: Role/title or home institution
#   - duration: Time period (e.g., "2026 - Present")
#   - email: Email address
#   - website: Personal website URL
#   - github: GitHub profile URL
#   - linkedin: LinkedIn profile URL
#   - google_scholar: Google Scholar profile URL
#   - orcid: ORCID URL
#
# Template:
#   - name:
#     photo:
#     info:
#     duration:
#     email:
#     website:
#     github:
#     linkedin:
#     google_scholar:
#     orcid:
